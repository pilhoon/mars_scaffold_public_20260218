[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-scaffold"
version = "0.1.0"
description = "MARS-inspired multi-process scaffold (file queue + sqlite + CLI LLM)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}
